name: PlateMate CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Setup LocalStack
        run: |
          docker compose up -d
          # Wait for LocalStack to be ready
          npx wait-on http://localhost:4566/_localstack/health

      - name: Deploy to LocalStack
        run: |
          # Install awslocal
          pip install awscli-local
          
          # Create DynamoDB Tables
          awslocal dynamodb create-table --table-name platemate-users --attribute-definitions AttributeName=userId,AttributeType=S --key-schema AttributeName=userId,KeyType=HASH --billing-mode PAY_PER_REQUEST
          awslocal dynamodb create-table --table-name platemate-reviews --attribute-definitions AttributeName=reviewId,AttributeType=S AttributeName=userId,AttributeType=S --key-schema AttributeName=reviewId,KeyType=HASH --global-secondary-indexes "IndexName=UserReviewsIndex,KeySchema=[{AttributeName=userId,KeyType=HASH}],Projection={ProjectionType=ALL}" --billing-mode PAY_PER_REQUEST
          awslocal dynamodb create-table --table-name platemate-restaurants --attribute-definitions AttributeName=placeId,AttributeType=S --key-schema AttributeName=placeId,KeyType=HASH --billing-mode PAY_PER_REQUEST
          
          # Create S3 Bucket
          awslocal s3 mb s3://platemate-assets
          
          # Create Lambda Execution Role (Mock)
          awslocal iam create-role --role-name lambda-role --assume-role-policy-document '{"Version": "2012-10-17","Statement": [{ "Effect": "Allow", "Principal": {"Service": "lambda.amazonaws.com"}, "Action": "sts:AssumeRole"}]}'
          
          # Create Lambda Function
          cd lambda && zip -r ../lambda.zip . && cd ..
          awslocal lambda create-function --function-name platemate-api-handler --runtime nodejs20.x --handler index.handler --role arn:aws:iam::000000000000:role/lambda-role --zip-file fileb://lambda.zip --environment "Variables={REVIEWS_TABLE=platemate-reviews,USERS_TABLE=platemate-users,RESTAURANTS_TABLE=platemate-restaurants,AVATAR_BUCKET=platemate-assets,USE_MOCK_DATA=true}"
          
          # Setup API Gateway
          API_ID=$(awslocal apigateway create-rest-api --name 'PlateMate API' --query 'id' --output text)
          PARENT_ID=$(awslocal apigateway get-resources --rest-api-id $API_ID --query 'items[0].id' --output text)
          
          # Create /{proxy+} resource
          RESOURCE_ID=$(awslocal apigateway create-resource --rest-api-id $API_ID --parent-id $PARENT_ID --path-part '{proxy+}' --query 'id' --output text)
          
          # Create ANY method for /{proxy+}
          awslocal apigateway put-method --rest-api-id $API_ID --resource-id $RESOURCE_ID --http-method ANY --authorization-type NONE
          
          # Integrate with Lambda
          awslocal apigateway put-integration --rest-api-id $API_ID --resource-id $RESOURCE_ID --http-method ANY --type AWS_PROXY --integration-http-method POST --uri arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:000000000000:function:platemate-api-handler/invocations
          
          # Create Deployment
          awslocal apigateway create-deployment --rest-api-id $API_ID --stage-name dev
          
          # Save API URL for next step
          echo "VITE_API_URL=http://localhost:4566/restapis/$API_ID/dev/_user_request_" >> $GITHUB_ENV

      - name: Integration Tests
        run: npm run test:integration

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npm run test:e2e

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Backend (AWS SAM)
        id: sam_deploy
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name platemate-pro-stack \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --parameter-overrides GoogleApiKey=${{ secrets.GOOGLE_API_KEY }}
          
          # Extract outputs
          API_URL=$(aws cloudformation describe-stacks --stack-name platemate-pro-stack --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name platemate-pro-stack --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name platemate-pro-stack --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name platemate-pro-stack --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name platemate-pro-stack --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)
          
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "user_pool_client_id=$USER_POOL_CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ steps.sam_deploy.outputs.api_url }}
          VITE_USER_POOL_ID: ${{ steps.sam_deploy.outputs.user_pool_id }}
          VITE_USER_POOL_CLIENT_ID: ${{ steps.sam_deploy.outputs.user_pool_client_id }}
        run: npm run build

      - name: Deploy Frontend to S3
        run: aws s3 sync dist/ s3://${{ steps.sam_deploy.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.sam_deploy.outputs.distribution_id }} --paths "/*"
