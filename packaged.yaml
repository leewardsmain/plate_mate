AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PlateMate Production Infrastructure
Parameters:
  GoogleApiKey:
    Type: String
    Default: ''
    Description: Google Maps/Places API Key
    NoEcho: true
  UseMockData:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: Whether to use mock data for restaurant searches if API fails or
      is missing
  ProjectName:
    Type: String
    Default: platemate
    Description: Project name for resource naming
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - PUT
          - POST
          - GET
          AllowedOrigins:
          - '*'
          MaxAge: 3000
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: OAC for PlateMate Frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
        - ErrorCode: 403
          ResponseCode: 200
          ResponsePagePath: /index.html
        - ErrorCode: 404
          ResponseCode: 200
          ResponsePagePath: /index.html
        Origins:
        - DomainName:
            Fn::GetAtt:
            - FrontendBucket
            - RegionalDomainName
          Id: S3Origin
          OriginAccessControlId:
            Ref: CloudFrontOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${FrontendBucket.Arn}/*
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: reviewId
        AttributeType: S
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: reviewId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: UserReviewsIndex
        KeySchema:
        - AttributeName: userId
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
  RestaurantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: placeId
        AttributeType: S
      KeySchema:
      - AttributeName: placeId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  ApiLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs20.x
      CodeUri: s3://platemate-frontend-app/8fb3b8500a8dfc9e8a47fce7af53da09
      MemorySize: 512
      Timeout: 30
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ReviewsTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RestaurantsTable
      - S3CrudPolicy:
          BucketName:
            Ref: FrontendBucket
      Environment:
        Variables:
          REVIEWS_TABLE:
            Ref: ReviewsTable
          USERS_TABLE:
            Ref: UsersTable
          AVATAR_BUCKET:
            Ref: FrontendBucket
          RESTAURANTS_TABLE:
            Ref: RestaurantsTable
          GOOGLE_API_KEY:
            Ref: GoogleApiKey
          USE_MOCK_DATA:
            Ref: UseMockData
          CLOUDFRONT_DOMAIN:
            Fn::GetAtt:
            - CloudFrontDistribution
            - DomainName
      Events:
        ProxyResource:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootResource:
          Type: Api
          Properties:
            Path: /
            Method: ANY
Outputs:
  FrontendBucketName:
    Value:
      Ref: FrontendBucket
    Description: Name of the Amazon S3 bucket used for frontend hosting.
  CloudFrontDomain:
    Value:
      Fn::GetAtt:
      - CloudFrontDistribution
      - DomainName
    Description: Domain name of the CloudFront distribution for the frontend.
  CloudFrontDistributionId:
    Value:
      Ref: CloudFrontDistribution
    Description: ID of the CloudFront distribution.
  ApiEndpoint:
    Value:
      Fn::Sub: https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
    Description: production URL of the API Gateway endpoint.
  UserPoolId:
    Value:
      Ref: UserPool
    Description: ID of the Cognito User Pool.
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
    Description: ID of the Cognito User Pool Client.
